# github/github-mcp-server --- DERIVED, not written by hand.
#
# Generated by scripts/refresh_manifests.py from pkg/github/__toolsnaps__ in the
# server's own repository: one JSON snapshot per tool, produced from its source
# by its own test suite. The read/write column is `annotations.readOnlyHint`,
# which is the server's actual enforcement boundary rather than a description of
# it --- `--read-only` drops exactly the tools that declare it false.
#
# The hand-written version of this file, built from the published README, was 40
# tools short of 122. That is the whole argument for deriving it.
#
# Entries record what the operation *is*, not how dangerous Altus thinks it is:
# `delete_repository` is listed as a write and `classify` is what decides it is
# privileged. Keeping that judgement in one place is what stops the manifest and
# the classifier drifting apart.

