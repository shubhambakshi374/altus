# Datadog's hosted MCP server --- 218 tools across 24 toolsets, from the
# published reference.
#
# Two entries here are the reason the classifier treats a server's own
# annotations as a ceiling and never a floor. Datadog labels `execute_code`
# (runs AI-authored TypeScript in a sandbox) and
# `datadog_remote_action_restricted_shell_run_command` (runs a shell command on
# a host) as read-only, on the grounds that both respect the caller's existing
# permissions. That is true and it is not the question: both take code from the
# model and run it somewhere else, which is the definition Altus uses for
# privileged. The classifier escalates them on the name.
source = "documented"
recorded = "2026-09-16"
reference = "https://docs.datadoghq.com/mcp_server/tools/"
target_fields = ["service", "env", "host"]

