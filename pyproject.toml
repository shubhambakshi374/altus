[project]
name = "altus"
version = "0.1.0"
description = "A TUI coding and DevOps harness with BYOK multi-provider LLM support"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Shubham Bakshi" }]
keywords = ["tui", "llm", "devops", "agent", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "textual>=8.2.8",
    "pydantic>=2.13",
    "platformdirs>=4.3",
    "typer>=0.15",
    "keyring>=25.7",
    "tomli-w>=1.2",
    "httpx>=0.28",
    "anthropic>=1.5.0",
    "openai>=3.13.0",
    "google-genai>=2.23.0",
    "mistralai>=2.10.0",
    "boto3>=1.43.0",
    "pathspec>=1.0",
]

[project.optional-dependencies]
k8s = ["kubernetes>=32.0"]
graphics = ["textual-image[textual]>=0.14"]
azure = ["azure-identity>=1.20"]
gcp = ["google-api-python-client>=2.150", "google-auth>=2.35"]
all = [
    "kubernetes>=32.0",
    "mcp>=2.2",
    "textual-image[textual]>=0.14",
    "azure-identity>=1.20",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
]
mcp = [
    # 2.x, not 1.9: the client path here already calls the v2 spelling
    # (`mcp.client.streamable_http.streamable_http_client`), and the server
    # path needs the v2 `Server(on_list_tools=..., on_call_tool=...)` callbacks
    # --- v1 used decorators. The pin was behind what the code already required.
    "mcp>=2.2",
]

[project.urls]
Homepage = "https://github.com/shubhambakshi374/altus"
Repository = "https://github.com/shubhambakshi374/altus"

[project.scripts]
altus = "altus.cli:main"

[dependency-groups]
dev = [
    "altus[all]",
    # pytest 9 is blocked by pytest-textual-snapshot, which pins syrupy==4.8.0
    # and so caps pytest <9. Revisit when that plugin catches up.
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.0",
    "pytest-textual-snapshot>=1.1",
    "pytest-timeout>=2.3",
    "textual-dev>=1.8",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/altus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits real provider APIs; requires credentials, opt-in via -m live",
]
addopts = "-m 'not live'"
# A hung test blocks the whole suite with no output; fail loudly instead.
timeout = 90

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
packages = ["altus"]
mypy_path = "src"
strict = true
warn_unused_ignores = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "keyring.*",
    "tomli_w.*",
    "mistralai.*",
    "google.genai.*",
    "kubernetes.*",
    "googleapiclient.*",
    "google.auth.*",
    "azure.*",
    "yaml",
]
ignore_missing_imports = true
