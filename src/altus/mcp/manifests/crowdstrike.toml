# CrowdStrike/falcon-mcp, derived from the module sources at a pinned tag.
#
# Two things here are worth knowing before reading the table.
#
# The names carry a `falcon_` prefix that does not appear in the source.
# `_add_tool` registers `f"falcon_{name}"`, so the module declaring
# `search_detections` publishes `falcon_search_detections`. Deriving from the
# unprefixed names would produce a manifest matching nothing at all --- which
# looks identical to a server with 166 unknown tools.
#
# `target_fields` is empty, and that is a finding rather than an omission.
# Every identifying argument Falcon takes is an opaque id, so the `*prod*`
# pattern that ships with ProtectionRules would match nothing. The blast
# radius of a Falcon call is the tenant, which is named by FALCON_BASE_URL and
# by nothing in the arguments --- so set `scope` under [mcp.crowdstrike] to
# name it. Until it is set, a Falcon target is unresolved, and the gate
# already treats an unresolved target as protected.

source = "derived"
recorded = "2026-09-16"
upstream_ref = "v0.19.0"
reference = "https://github.com/CrowdStrike/falcon-mcp"
target_fields = []

